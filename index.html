<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>模拟面板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body {
	font-family: system-ui;
	background:#000000;
	overflow:hidden;
}
.keyMask{
	position:fixed;
	inset:0;
	background:#08091c;
	z-index:99999;
	display:flex;
	align-items:center;
	justify-content:center;
}
.keyBox{
	width:320px;
	padding:30px 24px;
	border-radius:16px;
	background:#12182a;
	border:1px solid #222738;
	box-shadow:0 0 35px #000000;
	text-align:center;
}
.keyBox h3{
	color:#ffffff;
	font-size:20px;
	font-weight:700;
	margin-bottom:8px;
	letter-spacing:1px;
}
.keyBox .desc{
	color:#91a4d8;
	font-size:13px;
	line-height:1.55;
	margin-bottom:22px;
}
#pwdInput{
	width:100%;
	padding:14px 16px;
	background:#191c2b;
	border:1px solid #2c3144;
	color:#ffffff;
	border-radius:10px;
	font-size:16px;
	outline:none;
	margin-bottom:18px;
}
#pwdInput:focus{
	border-color:#409EFF;
}
#unlockBtn{
	width:100%;
	padding:14px;
	background:#409EFF;
	color:#ffffff;
	border:none;
	border-radius:10px;
	font-size:16px;
	font-weight:700;
	cursor:pointer;
}
#unlockBtn:active{
	transform:scale(0.97);
}
#unlockBtn:disabled{
	opacity:0.65;
	cursor:not-allowed;
}
#errTip{
	color:#ff5555;
	text-align:center;
	margin-top:12px;
	min-height:22px;
	font-size:14px;
}
.successTick{
	color:#28c76f;
	font-size:32px;
	margin:10px 0;
	display:none;
}
#app{display:none;}
.ayimgui {
	position: fixed;
	width: 430px;
	height: 360px;
	top: 50%;
	left: 50%;
	transform:translate(-50%,-50%);
	background:#18182a;
	border-radius:18px;
	overflow:hidden;
	border:1px solid #25283f;
	box-shadow:0 0 45px #000000;
}
.aytitle {
	padding:0 12px;
	height:32px;
	background:#1e223b;
	display:flex;
	justify-content:space-between;
	align-items:center;
	font-weight:700;
	color:#ffffff;
	font-size:15px;
	letter-spacing:0.5px;
}
.titleClose{
	cursor:pointer;
	font-size:20px;
	color:#bbbbbb;
	line-height:1;
	padding:0 4px;
}
.titleClose:hover{
	color:#ff5555;
}
.aybody{
	padding:14px;
	height:calc(100% - 32px);
	overflow-y:auto;
	color:#e5e5e5;
	font-size:14px;
}
.aytab{
	display:flex;
	gap:8px;
	margin-bottom:14px;
}
.tab-btn{
	padding:5px 14px;
	background:#202338;
	border:1px solid #2e334e;
	border-radius:6px 6px 0 0;
	cursor:pointer;
	white-space:nowrap;
	color:#cfcfcf;
	font-size:14px;
	font-weight:500;
}
.tab-btn.active{
	background:#273459;
	color:#ffffff;
	border-color:#409EFF;
}
.tab-page{display:none;}
.tab-page.show{display:block;}
.item{margin:8px 0;}
input[type=range]{
	width:100%;
	margin:8px 0;
	height:6px;
	background:#22253b;
	border-radius:3px;
	outline:none;
}
input[type=range]::-webkit-slider-thumb{
	-webkit-appearance:none;
	width:16px;
	height:16px;
	border-radius:50%;
	background:#409EFF;
	cursor:pointer;
}
label{
	color:#cfcfcf;
	font-size:14px;
	margin-right:12px;
}
input[type=checkbox],
input[type=radio]{
	accent-color:#409EFF;
	transform:scale(1.05);
}
.aybody::-webkit-scrollbar{
	width:6px;
}
.aybody::-webkit-scrollbar-track{
	background:transparent;
}
.aybody::-webkit-scrollbar-thumb{
	background:#2c304c;
	border-radius:3px;
}
</style>
</head>
<body>
<div class="keyMask" id="keyMask">
	<div class="keyBox">
		<h3>授权验证</h3>
		<p class="desc">请输入卡密完成解锁</p>
		<input id="pwdInput" placeholder="请输入卡密">
		<button id="unlockBtn">立即解锁</button>
		<div class="successTick" id="tickIcon">✓</div>
		<div id="errTip"></div>
	</div>
</div>

<div id="app">
<div class="ayimgui">
	<div class="aytitle">
		<span>权约空壳测试</span>
		<span class="titleClose" id="closeBtn">×</span>
	</div>
	<div class="aybody">
		<div class="aytab">
			<span class="tab-btn" data-id="page1">公告</span>
			<span class="tab-btn" data-id="page2">绘图</span>
			<span class="tab-btn" data-id="page3">参数</span>
			<span class="tab-btn" data-id="page4">设置</span>
		</div>
		<div class="tab-page" id="page1">
			<p id="timeText" style="text-align:center;margin-bottom:12px;color:#99aabb;"></p>
			<p style="text-align:center;color:#d96138;">支持快手正能量</p>
			<p style="text-align:center;color:#d96138;">禁止打压我，zako zako</p>
			<p style="text-align:center;margin-top:10px;color:#8899aa;">QQ群：1095841708</p>
			<p style="text-align:center;color:#ff5555;margin-top:8px;">Ver:飞机请联系@quanyuenb886</p>
		</div>
		<div class="tab-page" id="page2">
			<div class="item"><label><input type="checkbox">人物绘制</label></div>
			<div class="item"><label><input type="checkbox">射线</label></div>
			<div class="item"><label><input type="checkbox">血量</label></div>
			<div class="item"><label><input type="checkbox">方框</label></div>
			<div class="item"><label><input type="checkbox">信息</label></div>
			<div class="item"><label><input type="checkbox">物资绘制</label></div>
			<div class="item"><label><input type="checkbox">载具绘制</label></div>
		</div>
		<div class="tab-page" id="page3">
			<div class="item">绘制范围：<span id="rangeVal" style="color:#409EFF;font-weight:600;">400</span></div>
			<input type="range" min="1" max="500" id="rangeSlider">
			<div class="item">骨骼范围：<span id="boneVal" style="color:#409EFF;font-weight:600;">100</span></div>
			<input type="range" min="1" max="500" id="boneSlider">
		</div>
		<div class="tab-page" id="page4">
			<div class="item">绘制帧率
				<label><input type="radio" name="fps">60</label>
				<label><input type="radio" name="fps">90</label>
				<label><input type="radio" name="fps">120</label>
			</div>
			<div class="item">骨骼风格
				<label><input type="radio" name="bone">全骨</label>
				<label><input type="radio" name="bone">半骨</label>
			</div>
			<div class="item">雷达大小
				<label><input type="radio" name="rad">大</label>
				<label><input type="radio" name="rad">中</label>
				<label><input type="radio" name="rad">小</label>
			</div>
		</div>
	</div>
</div>
</div>

<script>
const mask = document.getElementById("keyMask");
const appBox = document.getElementById("app");
const input = document.getElementById("pwdInput");
const btnUnlock = document.getElementById("unlockBtn");
const err = document.getElementById("errTip");
const tickIcon = document.getElementById("tickIcon");

// 直接写死密钥字符串，不使用charCode数组，规避中文编码错位bug
const key1 = "LBYTOOL";
const key2 = "wzx爱吃季霸";

btnUnlock.onclick = function(){
	//trim自动过滤前后多余空格
	let text = input.value.trim();
	err.textContent = "";
	tickIcon.style.display = "none";
	btnUnlock.disabled = true;
	btnUnlock.innerText = "验证中...";

	setTimeout(()=>{
		let correct = text === key1 || text === key2;
		if(correct){
			tickIcon.style.display = "block";
			btnUnlock.innerText = "验证通过";
			setTimeout(()=>{
				mask.style.display = "none";
				appBox.style.display = "block";
			},450);
		}else{
			err.textContent = "卡密错误，请重试";
			btnUnlock.disabled = false;
			btnUnlock.innerText = "立即解锁";
		}
	},1200);
};

input.onkeydown = e => {
	if(e.key === "Enter" && !btnUnlock.disabled) btnUnlock.click();
};

document.getElementById("closeBtn").onclick = () => {
	appBox.style.display = "none";
};

const tabs = document.querySelectorAll(".tab-btn");
const pages = document.querySelectorAll(".tab-page");
pages[0].classList.add("show");
tabs[0].classList.add("active");
tabs.forEach(tab => {
	tab.onclick = function(){
		tabs.forEach(t => t.classList.remove("active"));
		pages.forEach(p => p.classList.remove("show"));
		this.classList.add("active");
		let pid = this.getAttribute("data-id");
		document.getElementById(pid).classList.add("show");
	};
});

const rangeS = document.getElementById("rangeSlider");
const rangeV = document.getElementById("rangeVal");
rangeS.oninput = () => rangeV.textContent = rangeS.value;

const boneS = document.getElementById("boneSlider");
const boneV = document.getElementById("boneVal");
boneS.oninput = () => boneV.textContent = boneS.value;

function setTime(){
	let d = new Date();
	document.getElementById("timeText").innerText = d.toLocaleString();
}
setInterval(setTime, 1000);
setTime();
</script>
</body>
</html>
